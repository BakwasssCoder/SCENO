<svg xmlns="http://www.w3.org/2000/svg" width="700" height="700" viewBox="0 0 700 700">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFD400"/>
      <stop offset="100%" stop-color="#FF5A1F"/>
    </linearGradient>
    <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#0b0b0d" opacity="0.16"/>
    </pattern>
  </defs>
  <rect width="700" height="700" fill="url(#g)"/>
  <rect width="700" height="700" fill="url(#dots)"/>
  <circle cx="120" cy="150" r="180" fill="#ffffff" opacity="0.1"/>
  <text x="50%" y="46%" font-family="Arial, sans-serif" font-size="140" text-anchor="middle" fill="#0b0b0d">📸</text>
  <text x="50%" y="66%" font-family="Arial, sans-serif" font-size="40" font-weight="800" text-anchor="middle" fill="#0b0b0d">PHOTO</text>
</svg>